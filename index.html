<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Validador de Identificación Militar - Teniente de Navío</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for military and UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --military-olive: #465333;
            --military-dark: #2c3521;
            --card-bg: #f5f5f0;
            --text-main: #111111;
            --text-muted: #555555;
            --accent: #5a6b42;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-frame {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background-color: var(--military-olive);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            position: relative;
            overflow: hidden;
            border-radius: 0px;
        }

        @media (min-width: 421px) {
            .mobile-frame {
                border-radius: 36px;
                border: 8px solid #2a2a2a;
            }
        }

        /* Laser animation for QR scanner */
        @keyframes scanLaser {
            0% { top: 5%; opacity: 0.8; }
            50% { top: 90%; opacity: 1; }
            100% { top: 5%; opacity: 0.8; }
        }

        .laser-line {
            position: absolute;
            width: 85%;
            height: 3px;
            background: #ef4444;
            box-shadow: 0 0 10px #ef4444, 0 0 20px #ef4444;
            animation: scanLaser 2.5s infinite ease-in-out;
            left: 7.5%;
        }

        /* Custom Scrollbar for inner content */
        .app-content::-webkit-scrollbar {
            width: 5px;
        }
        .app-content::-webkit-scrollbar-track {
            background: #e8e8e3;
        }
        .app-content::-webkit-scrollbar-thumb {
            background: #b5c49a;
            border-radius: 4px;
        }
